name: Build Unsigned IPA

# 在 GitHub 的 macOS runner 上编译出**未签名 ipa**，下载后用
# AltStore / Sideloadly / ESign 自签安装 —— 不需要自己有 Mac。
#
# 触发：Actions 页面手动 Run workflow，或推送 v* 标签。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 检查前端是否就位
        run: |
          set -e
          test -f Resources/WebApp/index.html || { echo "缺少 Resources/WebApp/index.html"; exit 1; }
          ls -la Resources/WebApp

      - name: 生成工程并编译未签名 ipa
        run: sh scripts/build-ipa.sh

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: VirtualBody-unsigned-ipa
          path: build/VirtualBody-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/dd/Logs/**
          if-no-files-found: ignore
          retention-days: 7
